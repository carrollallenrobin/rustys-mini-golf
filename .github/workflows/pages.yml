name: Deploy Web to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    name: Export Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            unzip \
            libfontconfig1 \
            libx11-6 \
            libxcursor1 \
            libxinerama1 \
            libxrandr2 \
            libxi6 \
            libgl1

          release="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 3 --retry-delay 2 \
            -o /tmp/godot.zip \
            "${release}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL --retry 3 --retry-delay 2 \
            -o /tmp/templates.tpz \
            "${release}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 \
            "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            /usr/local/bin/godot

          unzip -q /tmp/templates.tpz -d /tmp/templates
          template_dir="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "${template_dir}"
          cp -a /tmp/templates/templates/. "${template_dir}/"
          godot --version

      - name: Import project
        run: godot --headless --path Src --import --quit

      - name: Export Web release
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path Src --export-release "Web" "${PWD}/build/web/index.html"
          touch build/web/.nojekyll
          test -s build/web/index.html
          test -s build/web/index.js
          test -s build/web/index.wasm
          test -s build/web/index.pck

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
